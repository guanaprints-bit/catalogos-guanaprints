name: Sustituir teléfonos obsoletos de Guanaprints
on:
  push:
    branches: [main]
    paths:
      - 'scripts/normalizar_telefonos.py'
      - '.github/workflows/normalizar-telefonos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  limpiar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Corregir referencias antiguas en archivos de texto
        run: |
          python scripts/normalizar_telefonos.py --fix
          python scripts/normalizar_telefonos.py --check
      - name: Guardar correcciones si existen
        run: |
          git config user.name "Guanaprints Contact Maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No existen teléfonos antiguos en los archivos actuales."
            exit 0
          fi
          git commit -m "Actualizar contacto Guanaprints: eliminar teléfono anterior"
          git push origin HEAD:main
