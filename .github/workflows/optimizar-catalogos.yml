name: Generar miniaturas WebP para catálogos
on:
  push:
    branches: [main]
    paths:
      - 'scripts/optimizar_catalogos.py'
      - '.github/workflows/optimizar-catalogos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  imagenes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Pillow
        run: python -m pip install Pillow
      - name: Crear miniaturas y sustituir solamente tarjetas de catalogos
        run: python scripts/optimizar_catalogos.py
      # Valida los tamaños de maquetación originales, también con miniaturas WebP.
      - name: Validar integridad de catalogos
        run: |
          python scripts/verificar_seo.py
          python scripts/verificar_clasificacion.py
      - name: Publicar nuevos WebP y HTML en main
        run: |
          git config user.name "Guanaprints Catalog Optimizer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bodas/miniaturas/ 15-anos/miniaturas/ buscar/index.html bodas/index.html 15-anos/index.html invitaciones/
          if git diff --cached --quiet; then
            echo "Sin cambios por publicar"
            exit 0
          fi
          git commit -m "Catalogos: usar miniaturas WebP en tarjetas"
          git push origin HEAD:main
