name: Mantener ofertas informativas sin compra online
on:
  push:
    branches: [main]
    paths:
      - 'scripts/normalizar_disponibilidad.py'
      - '.github/workflows/normalizar-disponibilidad.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Quitar datos de existencias y compra en línea
        run: python scripts/normalizar_disponibilidad.py
      - name: Validar 403 fichas y datos estructurados
        run: python scripts/verificar_seo.py
      - name: Guardar solo las fichas modificadas
        run: |
          git config user.name "Guanaprints SEO Maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "Las ofertas ya corresponden al catálogo informativo."
            exit 0
          fi
          git commit -m "SEO: retirar señales de compra directa de las ofertas"
          git push origin HEAD:main
