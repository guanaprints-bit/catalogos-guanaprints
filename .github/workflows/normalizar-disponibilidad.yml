name: Corregir disponibilidad de productos para Google
on:
  push:
    branches: [main]
    paths:
      - 'scripts/normalizar_disponibilidad.py'
      - '.github/workflows/normalizar-disponibilidad.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  disponibilidad:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Registrar disponibilidad en fichas actuales
        run: python scripts/normalizar_disponibilidad.py
      - name: Validar SEO de las 403 fichas
        run: python scripts/verificar_seo.py
      - name: Guardar solo las fichas cambiadas
        run: |
          git config user.name "Guanaprints SEO Maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "Las ofertas existentes ya incluyen disponibilidad."
            exit 0
          fi
          git commit -m "SEO productos: declarar ofertas disponibles para personalización"
          git push origin HEAD:main
